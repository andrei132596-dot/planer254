<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Планер">
<title>Планер</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1c2430;--muted:#7a8794;--accent:#34c77b;--accent2:#4a9df8;--line:#e6eaef;--danger:#e5484d;--warn:#f5a623}
html[data-theme="dark"]{--bg:#12161c;--card:#1c222b;--text:#e8edf2;--muted:#8b97a5;--line:#2a323d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:30px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
header h1{font-size:22px;margin:0}
header button{border:none;background:var(--card);border-radius:12px;padding:8px 12px;font-size:18px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;position:sticky;top:0;background:var(--bg);z-index:5;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:none;background:var(--card);color:var(--muted);padding:8px 13px;border-radius:20px;font-size:14px;font-weight:600}
nav button.on{background:var(--accent);color:#fff}
main{padding:12px 14px 40px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:16px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
input,select,textarea{font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);width:100%;font-family:inherit}
textarea{resize:vertical}
button.btn{border:none;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;background:var(--accent2);color:#fff}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
button.danger{background:var(--danger);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.bignum{font-size:24px;font-weight:800}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .s{background:var(--bg);border-radius:12px;padding:10px}
.stat .s .v{font-size:20px;font-weight:800}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.bar.warn i{background:var(--warn)}
.bar.bad i{background:var(--danger)}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;background:transparent;color:transparent}
.chk.on{background:var(--accent);border-color:var(--accent);color:#fff}
.strike{text-decoration:line-through;color:var(--muted)}
.chip{padding:6px 12px;border-radius:14px;border:1px solid var(--line);background:transparent;font-size:13px;color:var(--muted);font-weight:600}
.chip.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.mini{padding:3px 8px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:13px;color:var(--muted)}
.tag{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--bg);color:var(--muted);font-weight:600}
.tag.red{background:rgba(229,72,77,.15);color:var(--danger)}
.hgrid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hgrid{display:grid;gap:2px;font-size:12px;min-width:max-content}
.hgrid .cell{height:30px;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:transparent}
.hgrid .cell.done{background:var(--accent);color:#fff}
.hgrid .cell.we{opacity:.55}
.hgrid .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;padding-right:4px;font-weight:600;display:flex;align-items:center;gap:4px}
.hgrid .hd{font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center}
.hgrid .pct{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .d{min-height:54px;border-radius:10px;background:var(--bg);padding:4px;font-size:11px;overflow:hidden}
.cal .d.today{outline:2px solid var(--accent2)}
.cal .d .n{font-weight:700;font-size:13px}
.glass{font-size:30px;filter:grayscale(1);opacity:.35;cursor:pointer}
.glass.on{filter:none;opacity:1}
.emoji{font-size:30px;filter:grayscale(1);opacity:.4;cursor:pointer;padding:2px 4px}
.emoji.on{filter:none;opacity:1}
.timer-num{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2430;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:99;max-width:90%}
#toast.show{opacity:1}
.ach{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ach:last-child{border-bottom:none}
.ach .ic{font-size:26px}
.ach.locked{opacity:.35}
input[type=range]{padding:0;accent-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.banner{background:rgba(74,157,248,.12);border:1px solid var(--accent2);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.moneytabs{display:flex;gap:6px;margin-bottom:12px}

.farm .fname{font-weight:700;font-size:15px}
.farm .fmeta{margin-top:3px;font-size:14px}
.farm a{color:var(--accent2);text-decoration:none;font-weight:600;white-space:nowrap}
.fnote{margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.fnote textarea{min-height:64px}
.btnsave{white-space:nowrap;flex:0 0 auto}
.btnsave.ok{background:var(--accent)}
.fhas{box-shadow:inset 3px 0 0 var(--accent)}
.fexc{margin-top:8px;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted);white-space:pre-wrap}
.fcount{font-weight:700;color:var(--text)}
</style>
</head>
<body>
<header>
  <h1>Планер</h1>
  <button data-act="theme" id="themeBtn">🌙</button>
</header>

<main id="view"></main>

function bestStreak(){var best=0;for(var i=0;i<S.habits.length;i++){var h=S.habits[i],days=[];for(var k in S.checks){if(k.split('|')[1]===h.id)days.push(k.split('|')[0])}days.sort();var cur=0,prev=null;for(var j=0;j<days.length;j++){if(prev&&new Date(days[j])-new Date(prev)===86400000){cur++}else{cur=1}prev=days[j];if(cur>best)best=cur}}return best}

function render(){var v=$('#view');v.innerHTML=RENDER[ui.tab]()}

/* ---------- data actions ---------- */
function toggleHabit(date,id){var key=date+'|'+id;if(S.checks[key]){delete S.checks[key]}else{S.checks[key]=1}save();render()}
function shiftMonth(pref,delta){if(pref==='hm'){ui.hMonth=monthShift(ui.hMonth,delta)}else if(pref==='mm'){ui.mMonth=monthShift(ui.mMonth,delta)}else{ui.calMonth=monthShift(ui.calMonth,delta)}render()}
function download(name,content,type){var b=new Blob([content],{type:type});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
function ics(){var rows=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Planer//RU'];var n=0;
  for(var i=0;i<S.tasks.length;i++){var t=S.tasks[i];if(t.done||!t.date)continue;n++;var dt=t.date.replace(/-/g,'');var txt=t.text.replace(/[,;]/g,' ');
    rows.push('BEGIN:VEVENT','UID:'+t.id+'@planer','DTSTART:'+dt+'T090000','DTEND:'+dt+'T093000','SUMMARY:'+txt,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+txt,'TRIGGER:-PT0M','END:VALARM','END:VEVENT')}
  if(!n){toast('Нет активных задач с датой');return}
  rows.push('END:VCALENDAR');download('Задачи.ics',rows.join('\r\n'),'text/calendar');toast('Файл готов: откройте его и добавьте в Календарь')}
function beep(){try{var C=window.AudioContext||window.webkitAudioContext;var c=new C();var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;o.start();setTimeout(function(){o.stop();c.close()},400)}catch(e){}}

/* timer */
var T={mode:'focus',left:1500,run:false,int:null};
function tick(){T.left--;if(T.left<=0){beep();if(T.mode==='focus'){S.pomodoro++;save();toast('🍅 Помидор готов! Пять минут перерыва');T.mode='break';T.left=300}else{toast('Перерыв закончился — пора за дело');T.mode='focus';T.left=1500}T.run=false;clearInterval(T.int);T.int=null;render();return}updTimerNum()}
function updTimerNum(){var el=document.querySelector('.timer-num');if(el){var mm=Math.floor(T.left/60);el.textContent=pad(mm)+':'+pad(T.left%60)}}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,id=el.dataset.id;
  if(a==='tab')switchTab(el.dataset.tab);
  else if(a==='theme'){S.settings.theme=S.settings.theme==='dark'?'light':'dark';applyTheme();save()}
  else if(a==='settheme'){S.settings.theme=el.dataset.v;applyTheme();save();render()}
  else if(a==='hc')toggleHabit(el.dataset.date,el.dataset.h);
  else if(a==='habitdel'){if(confirm('Удалить привычку?')){S.habits=S.habits.filter(function(h){return h.id!==id});save();render()}}
  else if(a==='water'){var w=S.water[TODAY]||0,i=+el.dataset.i;S.water[TODAY]=(i+1===w)?i:i+1;if(S.water[TODAY]>=S.settings.waterGoal&&w<S.settings.waterGoal)toast('💧 Норма воды на сегодня выпита — молодец!');save();render()}
  else if(a==='mood'){S.mood[TODAY]={e:+el.dataset.e,note:(S.mood[TODAY]||{}).note||''};save();render()}
  else if(a==='tchk'){var t=S.tasks.find(function(x){return x.id===id});if(t){t.done=!t.done;save();render()}}
  else if(a==='tdel'){if(confirm('Удалить задачу?')){S.tasks=S.tasks.filter(function(x){return x.id!==id});save();render()}}
  else if(a==='tfilt'){ui.tFilter=el.dataset.v;render()}
  else if(a==='gdel'){if(confirm('Удалить цель?')){S.goals=S.goals.filter(function(x){return x.id!==id});save();render()}}
  else if(a==='mtab'){ui.mTab=el.dataset.v;render()}
  else if(a==='txdel'){S.tx=S.tx.filter(function(x){return x.id!==id});save();render()}
  else if(a==='shopchk'){var it=S.shop.find(function(x){return x.id===id});if(it){it.done=!it.done;save();render()}}
  else if(a==='shopdel'){S.shop=S.shop.filter(function(x){return x.id!==id});save();render()}
  else if(a==='shopclear'){S.shop=S.shop.filter(function(x){return !x.done});save();render()}
  else if(a==='notedel'){S.notes=S.notes.filter(function(x){return x.id!==id});save();render()}
  else if(a==='hmp')shiftMonth('hm',-1);
  else if(a==='hmn')shiftMonth('hm',1);
  else if(a==='mmp')shiftMonth('mm',-1);
  else if(a==='mmn')shiftMonth('mm',1);
  else if(a==='cmp')shiftMonth('cm',-1);
  else if(a==='cmn')shiftMonth('cm',1);
  else if(a==='timer'){if(T.run){T.run=false;clearInterval(T.int);T.int=null;render()}else{T.run=true;T.int=setInterval(tick,1000);render()}}
  else if(a==='treset'){T.run=false;clearInterval(T.int);T.int=null;T.left=T.mode==='focus'?1500:300;render()}
  else if(a==='expics')ics();
  else if(a==='expjson')download('planer-backup.json',JSON.stringify(S,null,1),'application/json');
  else if(a==='wipe'){if(confirm('Точно стереть все данные? Их нельзя будет вернуть, если не сделали резервную копию.')){S=def();save();render();toast('Данные стёрты')}}
  else if(a==='fmore'){ui.fpage=(ui.fpage||1)+1;render()}
  else if(a==='fsave'){var ta=document.getElementById('fn-'+id);if(!ta)return;var v=ta.value.trim();
    if(v){S.farmNotes[id]=v}else{delete S.farmNotes[id]}save();
    var card=document.getElementById('card-'+id);if(card)card.classList.toggle('fhas',!!v);
    el.classList.add('ok');el.textContent='✓ Сохранено';toast('Комментарий сохранён');
    setTimeout(function(){el.classList.remove('ok');el.textContent='💾 Сохранить'},1600)}
  else if(a==='notif') {try{if('Notification' in window){Notification.requestPermission().then(function(p){if(p==='granted'){new Notification('Планер',{body:'Уведомления включены. Открывайте планер — напомню о задачах.'})}else{toast('Уведомления не разрешены в настройках iPhone')}})}else{toast('Этот режим не поддерживает уведомления')}}catch(e){toast('Уведомления недоступны')}}
});

document.addEventListener('input',function(e){
  var el=e.target,a=el.dataset.act;if(!a)return;
  if(a==='fsearch'){ui.fq=el.value;ui.fpage=1;farmRefresh(true);return}
  if(a==='gprog'){var g=S.goals.find(function(x){return x.id===el.dataset.id});if(g){g.progress=+el.value;el.closest('.card').querySelector('.gpl').textContent=g.progress+'%';el.closest('.card').querySelector('.bar i').style.width=g.progress+'%';save()}}
  else if(a==='budget'){S.budgets[el.dataset.cat]=+el.value||0;save();var bi=el.closest('.list-item').querySelector('.bar i');if(bi){var lim=S.budgets[el.dataset.cat];var sp=catSum(el.dataset.cat,ui.mMonth);var pct=lim?Math.round(sp/lim*100):0;if(bi.parentElement.className.indexOf('bar')===0||true){bi.parentElement.className='bar'+(pct>=100?' bad':(pct>=85?' warn':''));bi.style.width=Math.min(pct,100)+'%'}}}
  else if(a==='wgoal'){S.settings.waterGoal=Math.max(1,Math.min(15,+el.value||8));save()}
  else if(a==='wlimit'){S.settings.weekLimit=+el.value||0;save()}
  else if(a==='moodnote'){if(!S.mood[TODAY])S.mood[TODAY]={e:null,note:''};S.mood[TODAY].note=el.value;save()}
});

document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target;
  if(f.id==='fHabit'){var nm=f.iname.value.trim();if(nm){S.habits.push({id:uid(),name:nm});save();f.reset();render()}}
  else if(f.id==='fTask'){var tx=f.itext.value.trim();if(tx){S.tasks.push({id:uid(),text:tx,date:f.idate.value||TODAY,prio:f.iprio.value,cat:f.icat.value,done:false});save();f.reset();f.itext.focus();render()}}
  else if(f.id==='fGoal'){var gn=f.gname.value.trim();if(gn){S.goals.push({id:uid(),name:gn,sphere:f.gsphere.value,due:f.gdue.value,first:f.gfirst.value.trim(),progress:0});save();f.reset();render()}}
  else if(f.id==='fTx'){var sum=+f.isum.value;if(sum>0){S.tx.push({id:uid(),type:f.itype.value,cat:f.icat.value,sum:sum,date:f.idate.value||TODAY,note:f.inote.value.trim()});save();f.reset();f.idate.value=TODAY;render()}}
  else if(f.id==='fShop'){var sn=f.sname.value.trim();if(sn){S.shop.push({id:uid(),name:sn,done:false});save();f.reset();render()}}
  else if(f.id==='fNote'){var nt=f.ntext.value.trim();if(nt){S.notes.push({id:uid(),text:nt,date:TODAY});save();f.reset();render()}}
});

document.addEventListener('change',function(e){
  if(e.target.dataset.act==='fdistrict'){ui.fDist=e.target.value;ui.fpage=1;render();return}
  else if(e.target.id==='impFile'){var fl=e.target.files[0];if(!fl)return;var r=new FileReader();
    r.onload=function(){try{var data=JSON.parse(r.result);if(!data.habits)throw 0;S=Object.assign(def(),data);save();applyTheme();render();toast('Данные загружены ✔')}catch(err){toast('Не удалось прочитать файл — нужен planer-backup.json')}};r.readAsText(fl)}
});

function applyTheme(){document.documentElement.setAttribute('data-theme',S.settings.theme);var b=$('#themeBtn');if(b)b.textContent=S.settings.theme==='dark'?'☀️':'🌙'}

applyTheme();
switchTab('today');
(function(){var over=S.tasks.filter(function(t){return !t.done&&t.date&&t.date<TODAY}).length;var due=S.tasks.filter(function(t){return !t.done&&t.date===TODAY}).length;if(over||due)toast('🔔 Задач на сегодня: '+due+(over?', просрочено: '+over:''))})();
</script>
</body>
</html>
